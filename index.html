<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <button id="theme-toggle" class="btn btn-icon theme-toggle" aria-label="Toggle theme">&#x1F319;</button>
    <div class="greeting-row">
      <p id="greeting" class="greeting"></p>
      <button id="edit-name-btn" class="btn btn-icon btn-sm" aria-label="Edit name">&#x270F;&#xFE0F;</button>
    </div>
    <div id="name-edit-form" class="name-edit-form hidden">
      <input id="name-input" class="text-input" type="text" placeholder="Enter your name..." maxlength="40" aria-label="Your name" />
      <button id="name-save-btn" class="btn btn-accent btn-sm">Save</button>
      <button id="name-cancel-btn" class="btn btn-muted btn-sm">Cancel</button>
    </div>
    <p id="clock" class="clock"></p>
    <p id="date" class="date"></p>
  </header>

  <main class="main-grid">
    <section class="card timer-card" aria-label="Focus Timer">
      <h2 class="section-title">Focus Timer</h2>
      <div id="timer-display" class="timer-display">25:00</div>
      <p id="timer-status" class="timer-status">Ready</p>
      <div class="timer-presets">
        <button class="btn btn-muted btn-sm preset-btn" data-minutes="15">15 min</button>
        <button class="btn btn-muted btn-sm preset-btn" data-minutes="25">25 min</button>
        <button class="btn btn-muted btn-sm preset-btn" data-minutes="30">30 min</button>
        <button class="btn btn-muted btn-sm preset-btn" data-minutes="45">45 min</button>
        <button class="btn btn-muted btn-sm preset-btn" data-minutes="60">60 min</button>
      </div>
      <div class="timer-custom-row">
        <input id="custom-duration" class="text-input" type="number" min="1" max="180" placeholder="Custom (min)" aria-label="Custom duration in minutes" />
        <button id="custom-set-btn" class="btn btn-muted btn-sm">Set</button>
      </div>
      <div class="timer-buttons">
        <button id="timer-start" class="btn btn-accent">Start</button>
        <button id="timer-pause" class="btn btn-muted">Pause</button>
        <button id="timer-reset" class="btn btn-muted">Reset</button>
      </div>
      <p id="timer-done-msg" class="timer-done-msg hidden">&#x23F0; Focus session complete! Take a break.</p>
    </section>

    <section class="card todo-card" aria-label="To-Do List">
      <h2 class="section-title">To-Do List</h2>
      <div class="todo-input-row">
        <input id="todo-input" class="text-input" type="text" placeholder="Add a new task..." aria-label="New task" />
        <button id="todo-add" class="btn btn-accent">Add</button>
      </div>
      <p id="todo-msg" class="todo-msg" aria-live="polite"></p>
      <div class="sort-row">
        <label class="sr-only" for="sort-select">Sort tasks</label>
        <select id="sort-select" class="sort-select">
          <option value="default">Default Order</option>
          <option value="name-az">Name A-Z</option>
          <option value="name-za">Name Z-A</option>
          <option value="incomplete-first">Incomplete First</option>
          <option value="complete-first">Completed First</option>
        </select>
      </div>
      <p id="todo-count" class="todo-count">No tasks yet</p>
      <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
    </section>
  </main>

  <section class="card links-card" aria-label="Quick Links">
    <div class="links-header">
      <h2 class="section-title">Quick Links</h2>
      <button id="add-link-btn" class="btn btn-accent btn-sm">+ Add Link</button>
    </div>
    <div id="add-link-form" class="add-link-form hidden" role="form" aria-label="Add new link">
      <input id="link-name-input" class="text-input" type="text" placeholder="Name (e.g. GitHub)" aria-label="Link name" />
      <input id="link-url-input" class="text-input" type="url" placeholder="URL" aria-label="Link URL" />
      <div class="form-actions">
        <button id="link-save-btn" class="btn btn-accent btn-sm">Save</button>
        <button id="link-cancel-btn" class="btn btn-muted btn-sm">Cancel</button>
      </div>
    </div>
    <div id="links-grid" class="links-grid"></div>
  </section>

  <script src="js/script.js" defer></script>
</body>
</html>
